name: Upstream Sync

# Keeps this fork's master up to date with paperclipai/paperclip.
# Clean merges are pushed straight to master; conflicting merges open a PR
# so the acent-specific customizations can be reconciled by hand.

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync-master
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/paperclipai/paperclip.git
  UPSTREAM_BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "upstream-sync-bot"
          git config user.email "upstream-sync-bot@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Check for new upstream commits
        id: check
        run: |
          behind="$(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH})"
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" -eq 0 ]; then
            echo "master is already up to date with upstream."
          else
            echo "master is $behind commit(s) behind upstream."
          fi

      - name: Attempt merge
        if: steps.check.outputs.behind != '0'
        id: merge
        run: |
          if git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean merge to master
        if: steps.merge.outputs.clean == 'true'
        run: git push origin master

      - name: Open conflict-resolution PR
        if: steps.merge.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          BRANCH="sync/upstream-$(date -u +%Y%m%d)"

          # Push the raw upstream tip to a sync branch so the PR carries the
          # incoming commits and GitHub surfaces the conflicts for review.
          git push --force origin "upstream/${UPSTREAM_BRANCH}:refs/heads/${BRANCH}"

          existing="$(
            gh pr list --state open --head "$BRANCH" --base master --json url \
              --jq '.[0].url'
          )"
          if [ -n "$existing" ]; then
            echo "Conflict PR already open: $existing"
            exit 0
          fi

          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "sync: merge upstream into master ($(date -u +%Y-%m-%d))" \
            --body "Automated upstream sync hit merge conflicts with acent-specific customizations.

          Resolve the conflicts and merge this PR to bring \`master\` up to date with \`paperclipai/paperclip\`.

          Generated by the Upstream Sync workflow."
